# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Deploy Web API to Azure (master)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-master
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: 'Production'

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./NugetDependencyChecker.WebApi/NugetDependencyChecker.WebApi.csproj

      - name: Build with dotnet
        run: dotnet build ./NugetDependencyChecker.WebApi/NugetDependencyChecker.WebApi.csproj --configuration Release --no-restore

      - name: Publish Web API
        run: dotnet publish ./NugetDependencyChecker.WebApi/NugetDependencyChecker.WebApi.csproj -c Release -o ./publish

      - name: Verify published files exist
        run: |
          ls -la ./publish
          test -f ./publish/NugetDependencyChecker.WebApi.dll

      - name: Create deployment package
        run: |
          cd ./publish
          zip -r ../webapi.zip .
          cd ..
          ls -la ./webapi.zip
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_043A5C8A72054E358E85CA8324BBDAB6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7206E7BFE8724DB7B144B887B332C357 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_80891A99381747D0A96AF6E43C9B559A }}

      - name: Resolve resource group
        id: resolve-rg
        run: |
          RG=$(az webapp list --query "[?name=='nuget-dependencies'].resourceGroup | [0]" -o tsv)
          if [ -z "$RG" ]; then
            echo "Could not resolve resource group for app nuget-dependencies"
            exit 1
          fi
          echo "resource_group=$RG" >> "$GITHUB_OUTPUT"

      - name: Deploy zip package with Azure CLI
        run: |
          az webapp deploy \
            --resource-group "${{ steps.resolve-rg.outputs.resource_group }}" \
            --name "nuget-dependencies" \
            --src-path "./webapi.zip" \
            --type zip

      - name: Restart web app
        run: |
          az webapp restart \
            --resource-group "${{ steps.resolve-rg.outputs.resource_group }}" \
            --name "nuget-dependencies"

      - name: Verify home page is deployed
        run: |
          URL="https://nuget-dependencies.azurewebsites.net/"
          EXPECTED="NuGet Dependency Checker API"

          echo "Verifying deployment at $URL"
          for attempt in {1..20}; do
            STATUS=$(curl -s -o response.html -w "%{http_code}" "$URL" || true)

            if grep -q "$EXPECTED" response.html; then
              echo "Deployment verified on attempt $attempt (HTTP $STATUS)."
              exit 0
            fi

            echo "Attempt $attempt/20: expected marker not found (HTTP $STATUS). Waiting 15s..."
            sleep 15
          done

          echo "Deployment verification failed. First 120 lines of response:"
          sed -n '1,120p' response.html
          exit 1
